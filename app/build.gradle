plugins {
    id 'com.android.application'
}

android {
    namespace 'com.navireloj'
    compileSdk 34

    defaultConfig {
        applicationId 'com.navireloj'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.10'
    }

    // Clave fija incluida en el proyecto, para que cada versión nueva
    // se instale encima de la anterior sin tener que desinstalar.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

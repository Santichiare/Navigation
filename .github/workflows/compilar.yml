name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NaviReloj.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NaviReloj
          path: NaviReloj.apk

      # Publica el APK como Release, así siempre se baja directo de:
      # https://github.com/Santichiare/Navigation/releases/latest/download/NaviReloj.apk
      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: NaviReloj 1.0 (compilación ${{ github.run_number }})
          body: |
            App del celular de NaviReloj. Descargá **NaviReloj.apk** e instalala encima de la anterior.
            Cambios: ${{ github.event.head_commit.message }}
          files: NaviReloj.apk
          make_latest: true
